<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amatör Arena · Maç Oluştur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #060b16;
        --panel: rgba(22, 33, 56, 0.72);
        --panel-border: rgba(170, 195, 255, 0.14);
        --text: #eef2fa;
        --muted: #8fa0bf;
        --accent: #4f8cff;
        --accent-2: #8fb5ff;
        --danger: #ff6b6b;
        --ok: #3ddc97;
        --radius: 22px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100vh;
        background:
          radial-gradient(ellipse 80% 45% at 50% -5%, rgba(79, 140, 255, 0.22), transparent 70%),
          radial-gradient(ellipse 90% 70% at 50% 60%, #0f1c33 0%, var(--bg) 70%);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        padding: 48px 16px 64px;
      }
      main { width: 100%; max-width: 920px; }
      header { text-align: center; margin-bottom: 36px; }
      .brand {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: clamp(44px, 8vw, 72px);
        letter-spacing: 4px;
        line-height: 1;
        margin: 0;
        background: linear-gradient(180deg, #ffffff 35%, #bcd0ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 22px rgba(79, 140, 255, 0.35));
      }
      .brand .big { font-size: 1.22em; }
      .subtitle {
        margin: 10px 0 0;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .teams {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: stretch;
      }
      .vs {
        align-self: center;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-style: italic;
        font-size: 34px;
        color: rgba(255, 255, 255, 0.35);
      }
      .team {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(8px);
      }
      .team h2 {
        margin: 0 0 18px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent-2);
      }
      .field-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        margin: 0 0 8px;
      }
      input[type="text"] {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid var(--panel-border);
        background: rgba(5, 10, 22, 0.6);
        color: var(--text);
        font-size: 17px;
        font-weight: 500;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
        margin-bottom: 20px;
      }
      input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.2); }
      .drop {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 210px;
        border-radius: 16px;
        border: 2px dashed rgba(170, 195, 255, 0.25);
        background: rgba(5, 10, 22, 0.45);
        color: var(--muted);
        text-align: center;
        font-size: 14px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
        overflow: hidden;
      }
      .drop:hover, .drop.dragover { border-color: var(--accent); background: rgba(79, 140, 255, 0.08); }
      .drop input { display: none; }
      .drop .hint strong { color: var(--text); font-weight: 600; }
      .drop img {
        display: none;
        width: 150px;
        height: 150px;
        object-fit: contain;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff 0%, #eef2f8 60%, #d9e0ec 100%);
        padding: 16px;
        box-shadow: 0 0 0 5px var(--ring, rgba(255, 255, 255, 0.2)), 0 14px 30px rgba(0, 0, 0, 0.5);
      }
      .drop.has-image img { display: block; }
      .drop.has-image .hint { display: none; }
      .drop .change { display: none; font-size: 12px; }
      .drop.has-image .change { display: block; }
      .actions { margin-top: 30px; text-align: center; }
      .btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        border: none;
        border-radius: 16px;
        padding: 18px 44px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 24px;
        letter-spacing: 3px;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(180deg, #5b95ff 0%, #2f6bff 100%);
        box-shadow: 0 14px 34px rgba(47, 107, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        transition: transform 0.1s, filter 0.15s, opacity 0.15s;
      }
      .btn:hover { filter: brightness(1.08); }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
      .btn.secondary {
        background: rgba(22, 33, 56, 0.9);
        border: 1px solid var(--panel-border);
        box-shadow: none;
        font-size: 20px;
        padding: 15px 28px;
      }
      .message { min-height: 24px; margin: 14px 0 0; color: var(--danger); font-weight: 600; }
      .status {
        display: none;
        margin-top: 28px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        padding: 28px;
        text-align: center;
      }
      .status.visible { display: block; }
      .phase { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
      .percent {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 64px;
        line-height: 1.1;
        margin: 0 0 14px;
      }
      .bar { height: 12px; border-radius: 999px; background: rgba(5, 10, 22, 0.7); overflow: hidden; }
      .bar > div {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2f6bff, #8fb5ff);
        box-shadow: 0 0 18px rgba(79, 140, 255, 0.6);
        transition: width 0.4s ease;
      }
      .seed { margin: 14px 0 0; font-size: 12px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
      .done-title {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 48px;
        letter-spacing: 4px;
        color: var(--ok);
        margin: 0 0 6px;
      }
      .file { color: var(--muted); font-size: 14px; margin: 0 0 22px; word-break: break-all; }
      .done-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      .hidden { display: none !important; }
      fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
      fieldset:disabled .drop { cursor: not-allowed; opacity: 0.6; }
      @media (max-width: 760px) {
        body { padding-top: 32px; }
        .teams { grid-template-columns: 1fr; }
        .vs { justify-self: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 class="brand"><span class="big">A</span>MATÖR <span class="big">A</span>RENA</h1>
        <p class="subtitle">Maç Oluştur</p>
      </header>

      <form id="form" novalidate>
        <fieldset id="fields">
          <div class="teams">
            <section class="team" data-side="home">
              <h2>Ev Sahibi</h2>
              <label class="field-label" for="homeName">Takım adı</label>
              <input type="text" id="homeName" maxlength="40" autocomplete="off" placeholder="Örn. Gülsuyu SK" />
              <span class="field-label">Logo</span>
              <label class="drop" data-drop="home">
                <input type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" data-file="home" />
                <div class="hint"><strong>Logoyu sürükle-bırak</strong><br />veya dosya seç<br /><small>PNG · JPG · WEBP</small></div>
                <img alt="Ev sahibi logosu" data-preview="home" />
                <span class="change">Değiştirmek için tıkla</span>
              </label>
            </section>

            <div class="vs">VS</div>

            <section class="team" data-side="away">
              <h2>Konuk Takım</h2>
              <label class="field-label" for="awayName">Takım adı</label>
              <input type="text" id="awayName" maxlength="40" autocomplete="off" placeholder="Örn. Konyaspor" />
              <span class="field-label">Logo</span>
              <label class="drop" data-drop="away">
                <input type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" data-file="away" />
                <div class="hint"><strong>Logoyu sürükle-bırak</strong><br />veya dosya seç<br /><small>PNG · JPG · WEBP</small></div>
                <img alt="Konuk takım logosu" data-preview="away" />
                <span class="change">Değiştirmek için tıkla</span>
              </label>
            </section>
          </div>
        </fieldset>

        <div class="actions" id="createActions">
          <button class="btn" type="submit" id="createBtn">MAÇ OLUŞTUR</button>
          <p class="message" id="message" role="alert"></p>
        </div>
      </form>

      <section class="status" id="status" aria-live="polite">
        <div id="progressView">
          <p class="phase" id="phase">Maç hazırlanıyor...</p>
          <p class="percent" id="percent">%0</p>
          <div class="bar"><div id="bar"></div></div>
          <p class="seed" id="seed"></p>
        </div>
        <div id="doneView" class="hidden">
          <p class="done-title">VİDEO HAZIR</p>
          <p class="file" id="fileName"></p>
          <div class="done-actions">
            <button class="btn" type="button" id="openBtn">MP4'Ü AÇ</button>
            <a class="btn secondary" id="downloadBtn" href="#" download>MP4'Ü İNDİR</a>
            <button class="btn secondary" type="button" id="newBtn">YENİ MAÇ</button>
          </div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
